name: Sauvegarde des données Firestore

# ─────────────────────────────────────────────────────────────────────────────
# GitHub (firebase-hosting-merge.yml) protège déjà le CODE : chaque commit est
# conservé avec son historique, rien n'est jamais perdu même en cas de casse.
# Mais les DONNÉES produites par les utilisateurs (comptes, écritures, factures,
# emprunts...) ne vivent que dans Firestore — elles ne sont pas versionnées par
# git. Ce workflow exporte l'intégralité de la base vers Cloud Storage sur un
# rythme régulier, pour disposer d'un point de restauration en cas de suppression
# accidentelle, de règles de sécurité mal déployées ou d'incident côté Firebase.
#
# Restauration : gcloud firestore import gs://.../firestore-backups/<horodatage>
# (voir la documentation Firestore "Importer et exporter des données").
#
# Bucket dédié (et non le bucket d'assets campus-ohada.firebasestorage.app,
# situé en us-east1) : Firestore exige que le bucket de destination soit dans
# la MÊME région que la base — la base de ce projet est en eu/europe-west1.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 3 * * 0'  # tous les dimanches à 03h00 UTC
  workflow_dispatch:      # déclenchement manuel depuis l'onglet Actions

jobs:
  export_firestore:
    runs-on: ubuntu-latest
    steps:
      - name: Authentifier le compte de service Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAMPUS_OHADA }}

      - name: Installer gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Créer le bucket de sauvegarde s'il n'existe pas encore
        run: |
          gcloud storage buckets describe gs://campus-ohada-firestore-backups >/dev/null 2>&1 || \
          gcloud storage buckets create gs://campus-ohada-firestore-backups \
            --project=campus-ohada --location=eu --uniform-bucket-level-access

      - name: Exporter Firestore vers Cloud Storage
        run: |
          HORODATAGE=$(date -u +%Y-%m-%d_%Hh%M)
          gcloud firestore export "gs://campus-ohada-firestore-backups/$HORODATAGE" \
            --project=campus-ohada
