name: Déploiement Firebase (main)

# Déploie automatiquement le site (Hosting) et les règles/index Firestore
# à chaque push sur la branche principale. Peut aussi être lancé manuellement
# depuis l'onglet "Actions" de GitHub (bouton "Run workflow").
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Versions 5 des actions : elles tournent sous Node 24 (les versions 4,
      # sous Node 20, étaient signalées obsolètes par GitHub).
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # L'émulateur Firestore (lancé par le hook prebuild pour les tests d'isolation)
      # exige Java 21+ depuis une version récente de firebase-tools ; ubuntu-latest
      # n'embarque que Java 17 par défaut.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # npm ci : installation exacte des fichiers de verrouillage, servie par le
      # cache. firebase-tools fait partie des dépendances du projet : il n'est
      # plus téléchargé à part à chaque lancement de l'émulateur ou du
      # déploiement (une coupure réseau pendant ce téléchargement avait fait
      # échouer le déploiement du 21/10/2026).
      - name: Installer les dépendances (racine)
        run: npm ci

      - name: Installer les dépendances (client)
        run: npm ci
        working-directory: client

      # Séparé du build : l'émulateur Firestore peut occasionnellement rester bloqué
      # au démarrage sur un runner à froid. timeout-minutes évite qu'un run pende
      # indéfiniment (le job entier attendrait sinon la limite par défaut de 6h).
      - name: Tests des calculs
        run: npm run test:calculs
        timeout-minutes: 3

      - name: Tests d'isolation Firestore
        run: npm run test:firestore
        timeout-minutes: 5

      - name: Build
        run: SKIP_FIRESTORE_TESTS=1 npm run build
        timeout-minutes: 5

      - name: Authentifier le compte de service Firebase
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAMPUS_OHADA }}

      - name: Déployer (Hosting + règles + index Firestore)
        run: npx firebase-tools deploy --project campus-ohada --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
